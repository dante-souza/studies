# Especificação de modelos — validada por SpecFile (notebook 05)
enums:
  BodyType:
    values: [sedan, coupe, suv, truck]
  Priority:
    kind: int
    values: {LOW: 1, MEDIUM: 2, HIGH: 3}

models:
  Automobile:
    policy: api_input
    description: Carro do projeto do curso
    fields:
      manufacturer: {type: str, min_length: 2, max_length: 50, normalize: [strip_title]}
      body_type: {type: BodyType}
      manufactured_date: {type: date, ge: 1980-01-01}
      number_of_doors: {type: int, ge: 2, le: 4, default: 4}
      registration_country: {type: RegistrationCountry, nullable: true, default: null}
      top_features: {type: str, many: true, default: []}

  RegistrationCountry:
    policy: internal
    fields:
      name: {type: str, min_length: 2, validators: [no_digits]}
      code3: {type: str, pattern: "^[A-Z]{3}$"}

  ServiceTicket:
    policy: api_input
    description: Chamado de manutenção
    fields:
      vin: {type: str, pattern: "^[A-HJ-NPR-Z0-9]{17}$", normalize: [upper]}
      priority: {type: Priority, default: 2}
      opened_at: {type: datetime}
      car: {type: Automobile}
